<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primetrade Task Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }
        
        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        button {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
        }
        
        button:hover {
            background: #5a67d8;
        }
        
        .btn-danger {
            background: #e53e3e;
        }
        
        .btn-danger:hover {
            background: #c53030;
        }
        
        .btn-success {
            background: #48bb78;
        }
        
        .task-item {
            border: 1px solid #e2e8f0;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
        }
        
        .task-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .hidden {
            display: none;
        }
        
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .alert {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        
        .alert-success {
            background: #c6f6d5;
            color: #22543d;
        }
        
        .alert-error {
            background: #fed7d7;
            color: #742a2a;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Login/Register Section -->
        <div id="authSection" class="card">
            <div class="nav">
                <h2>Primetrade Task Manager</h2>
                <div>
                    <button onclick="showLogin()">Login</button>
                    <button onclick="showRegister()">Register</button>
                </div>
            </div>

            <div id="loginForm">
                <h3>Login</h3>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="Enter email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter password">
                </div>
                <button onclick="login()">Login</button>
            </div>

            <div id="registerForm" class="hidden">
                <h3>Register</h3>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="regUsername" placeholder="Username">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" placeholder="Email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" placeholder="Password">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="regPassword2" placeholder="Confirm password">
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="regRole">
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <button onclick="register()">Register</button>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboardSection" class="hidden">
            <div class="card">
                <div class="nav">
                    <h2>Task Dashboard</h2>
                    <div>
                        <span id="userEmail" style="margin-right: 15px;"></span>
                        <span id="userRole" style="margin-right: 15px;"></span>
                        <button onclick="logout()">Logout</button>
                    </div>
                </div>
                <div id="alertDiv"></div>
            </div>

            <div class="grid">
                <div class="card">
                    <h3>Create New Task</h3>
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="taskTitle" placeholder="Task title">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="taskDesc" rows="3" placeholder="Task description"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Priority</label>
                        <select id="taskPriority">
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Due Date</label>
                        <input type="datetime-local" id="taskDueDate">
                    </div>
                    <button onclick="createTask()">Create Task</button>
                </div>

                <div class="card">
                    <h3>My Tasks</h3>
                    <div id="tasksList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let accessToken = localStorage.getItem('accessToken');
        let currentUser = null;

        function showLogin() {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('registerForm').classList.add('hidden');
        }

        function showRegister() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
        }

        async function register() {
            const data = {
                username: document.getElementById('regUsername').value,
                email: document.getElementById('regEmail').value,
                password: document.getElementById('regPassword').value,
                password2: document.getElementById('regPassword2').value,
                role: document.getElementById('regRole').value
            };

            try {
                const response = await fetch('/api/v1/auth/register/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showAlert('Registration successful! Please login.', 'success');
                    showLogin();
                    clearRegisterForm();
                } else {
                    const error = await response.json();
                    showAlert(JSON.stringify(error), 'error');
                }
            } catch (error) {
                showAlert('Registration failed', 'error');
            }
        }

        async function login() {
            const data = {
                email: document.getElementById('loginEmail').value,
                password: document.getElementById('loginPassword').value
            };

            try {
                const response = await fetch('/api/v1/auth/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    const result = await response.json();
                    localStorage.setItem('accessToken', result.access);
                    localStorage.setItem('refreshToken', result.refresh);
                    accessToken = result.access;
                    currentUser = result.user;
                    loadDashboard();
                } else {
                    showAlert('Invalid credentials', 'error');
                }
            } catch (error) {
                showAlert('Login failed', 'error');
            }
        }

        async function loadDashboard() {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            document.getElementById('userEmail').innerText = currentUser.email;
            document.getElementById('userRole').innerText = `Role: ${currentUser.role}`;
            await loadTasks();
        }

        async function loadTasks() {
            try {
                const response = await fetch('/api/v1/tasks/', {
                    headers: {
                        'Authorization': `Bearer ${accessToken}`
                    }
                });

                if (response.ok) {
                    const tasks = await response.json();
                    displayTasks(tasks);
                }
            } catch (error) {
                console.error('Failed to load tasks', error);
            }
        }

        function displayTasks(tasks) {
            const container = document.getElementById('tasksList');
            if (!tasks.results) tasks = {
                results: tasks
            };
            const taskList = tasks.results || tasks;

            if (taskList.length === 0) {
                container.innerHTML = '<p>No tasks found. Create your first task!</p>';
                return;
            }

            container.innerHTML = taskList.map(task => `
                <div class="task-item">
                    <div class="task-title">${task.title}</div>
                    <div>${task.description}</div>
                    <div><strong>Status:</strong> ${task.status}</div>
                    <div><strong>Priority:</strong> ${task.priority}</div>
                    ${task.due_date ? `<div><strong>Due:</strong> ${new Date(task.due_date).toLocaleDateString()}</div>` : ''}
                    <div style="margin-top: 10px;">
                        <button onclick="updateTaskStatus(${task.id}, 'completed')">Complete</button>
                        <button class="btn-danger" onclick="deleteTask(${task.id})">Delete</button>
                    </div>
                </div>
            `).join('');
        }
        
        async function createTask() {
            const data = {
                title: document.getElementById('taskTitle').value,
                description: document.getElementById('taskDesc').value,
                priority: document.getElementById('taskPriority').value,
                due_date: document.getElementById('taskDueDate').value
            };
            
            try {
                const response = await fetch('/api/v1/tasks/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${accessToken}`
                    },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    showAlert('Task created successfully!', 'success');
                    clearTaskForm();
                    await loadTasks();
                } else {
                    showAlert('Failed to create task', 'error');
                }
            } catch (error) {
                showAlert('Error creating task', 'error');
            }
        }
        
        async function updateTaskStatus(taskId, status) {
            try {
                const response = await fetch(`/api/v1/tasks/${taskId}/`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${accessToken}`
                    },
                    body: JSON.stringify({status: status})
                });
                
                if (response.ok) {
                    await loadTasks();
                }
            } catch (error) {
                console.error('Failed to update task', error);
            }
        }
        
        async function deleteTask(taskId) {
            if (confirm('Are you sure?')) {
                try {
                    const response = await fetch(`/api/v1/tasks/${taskId}/`, {
                        method: 'DELETE',
                        headers: {'Authorization': `Bearer ${accessToken}`}
                    });
                    
                    if (response.ok) {
                        await loadTasks();
                    }
                } catch (error) {
                    console.error('Failed to delete task', error);
                }
            }
        }
        
        function logout() {
            localStorage.removeItem('accessToken');
            localStorage.removeItem('refreshToken');
            accessToken = null;
            currentUser = null;
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('dashboardSection').classList.add('hidden');
            showLogin();
        }
        
        function showAlert(message, type) {
            const alertDiv = document.getElementById('alertDiv');
            alertDiv.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => alertDiv.innerHTML = '', 3000);
        }
        
        function clearRegisterForm() {
            document.getElementById('regUsername').value = '';
            document.getElementById('regEmail').value = '';
            document.getElementById('regPassword').value = '';
            document.getElementById('regPassword2').value = '';
        }
        
        function clearTaskForm() {
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskDesc').value = '';
            document.getElementById('taskPriority').value = 'medium';
            document.getElementById('taskDueDate').value = '';
        }
        
        // Check if already logged in
        if (accessToken) {
            fetch('/api/v1/auth/profile/', {
                headers: {'Authorization': `Bearer ${accessToken}`}
            }).then(response => {
                if (response.ok) {
                    response.json().then(user => {
                        currentUser = user;
                        loadDashboard();
                    });
                } else {
                    logout();
                }
            }).catch(() => logout());
        } else {
            showLogin();
        }
    </script>
</body>

</html>
